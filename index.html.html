<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Deals & Pending Slots</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-color: #ffffff;
      --accent: #4ade80;
      --danger: #f87171;
      --warning: #fbbf24;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--glass-border);
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid var(--glass-border);
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
    }

    .glass-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .product-img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9); /* White bg for clear amazon products */
      padding: 0.5rem;
      box-sizing: border-box;
    }

    .badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .badge {
      background: rgba(255,255,255,0.15);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .product-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0;
      color: #ffffff;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0.8rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      align-items: center;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .pending { color: var(--accent); }
    .commission { color: var(--warning); }
    
    .review-issue {
      background: rgba(248, 113, 113, 0.15);
      border-left: 3px solid var(--danger);
      padding: 0.5rem;
      font-size: 0.85rem;
      color: #fca5a5;
      border-radius: 4px;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: auto;
      width: 100%;
    }

    .copy-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .copy-btn.copied { background: rgba(74, 222, 128, 0.4); border-color: var(--accent); }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 5rem;
      color: #94a3b8;
    }
    
    .timer-text { font-size: 0.85rem; color: #94a3b8; }
    .icon { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Live Deals & Slots</h1>
        <p class="timer-text">Auto-refreshing in <span id="countdown">30</span>s</p>
      </div>
      <div class="live-indicator">
        <div class="dot"></div>
        <span>Live Sheet Sync</span>
      </div>
    </header>

    <div id="loading">Syncing data from Google Sheet...</div>
    <div class="product-grid" id="productGrid" style="display: none;"></div>
  </div>

  <script>
    // =========================================================================
    // IMPORTANT: Yahan apna Google Sheet ka Published CSV link paste karein!
    // =========================================================================
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_G_izI9M7UirOuc-xCe8w-wK9JFi5lJ4Bv6QL7qVFFlHZtz-sKbLbH19jhkXFT54fT4D6mSkJXpqc/pub?output=csv";
    
    // Aapki Sheet ki headings ke numbers (0 se start hota hai)
    const COLUMN_MAP = {
        ordersPending: 0, // Orders Pendng
        productName: 1,   // Product name/Code
        orderLink: 2,     // Order Links
        asin: 3,          // ASIN
        brand: 4,         // Brand Name
        category: 5,      // Catogory
        commission: 6,    // Rating/Review Commissionin
        reviewIssue: 7    // Review issue
    };

    const REFRESH_INTERVAL = 30;
    let countdownTimer = REFRESH_INTERVAL;

    setInterval(() => {
        countdownTimer--;
        if(countdownTimer < 0) countdownTimer = REFRESH_INTERVAL;
        document.getElementById('countdown').innerText = countdownTimer;
    }, 1000);

    // CSV Parser
    function parseCSV(str) {
        const arr = [];
        let quote = false;
        for (let row = 0, col = 0, c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            arr[row] = arr[row] || [];
            arr[row][col] = arr[row][col] || '';
            
            if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
            if (cc == '"') { quote = !quote; continue; }
            if (cc == ',' && !quote) { ++col; continue; }
            if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
            if (cc == '\n' && !quote) { ++row; col = 0; continue; }
            if (cc == '\r' && !quote) { ++row; col = 0; continue; }
            
            arr[row][col] += cc;
        }
        return arr;
    }

    async function fetchData() {
        if(GOOGLE_SHEET_CSV_URL === "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_G_izI9M7UirOuc-xCe8w-wK9JFi5lJ4Bv6QL7qVFFlHZtz-sKbLbH19jhkXFT54fT4D6mSkJXpqc/pub?output=csv") {
             document.getElementById('loading').innerText = "Please paste valid Google Sheet CSV URL in the code.";
             return;
        }

        try {
            const response = await fetch(`${GOOGLE_SHEET_CSV_URL}&t=${new Date().getTime()}`);
            if(!response.ok) throw new Error("Network response error");
            const text = await response.text();
            
            const rows = parseCSV(text);
            renderProducts(rows);
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('productGrid').style.display = 'grid';
            countdownTimer = REFRESH_INTERVAL;
            
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    function renderProducts(rows) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = ''; 

        // Start from index 1 to skip header row
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            
            if (!row || !row[COLUMN_MAP.productName] || row[COLUMN_MAP.productName].trim() === "") continue;

            const pending = row[COLUMN_MAP.ordersPending] || "0";
            const title = row[COLUMN_MAP.productName];
            const link = row[COLUMN_MAP.orderLink] || "#";
            const asin = (row[COLUMN_MAP.asin] || "").trim();
            const brand = row[COLUMN_MAP.brand] || "No Brand";
            const category = row[COLUMN_MAP.category] || "General";
            const commission = row[COLUMN_MAP.commission] || "-";
            const reviewIssue = row[COLUMN_MAP.reviewIssue] || "";

            // ASIN Image Trick: Amazon ke official image server se photo fetch karna
            const imgUrl = asin ? `https://ws-na.amazon-adsystem.com/widgets/q?_encoding=UTF8&Format=_SL500_&ASIN=${asin}&MarketPlace=IN&ID=AsinImage&WS=1&ServiceVersion=20070822` : "https://via.placeholder.com/400x300?text=No+ASIN+Provided";

            const card = document.createElement('div');
            card.className = 'glass-card';
            
            let issueHTML = reviewIssue ? `<div class="review-issue">⚠️ <b>Issue:</b> ${reviewIssue}</div>` : '';

            card.innerHTML = `
                <img src="${imgUrl}" alt="${title}" class="product-img" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Not+Found'">
                
                <div class="badges">
                    <span class="badge">${brand}</span>
                    <span class="badge">${category}</span>
                </div>

                <h3 class="product-title" title="${title}">${title}</h3>
                
                <div class="stats-row">
                    <span class="stat-label">Pending Orders</span>
                    <span class="stat-value pending">${pending}</span>
                </div>
                
                <div class="stats-row">
                    <span class="stat-label">Commission</span>
                    <span class="stat-value commission">${commission}</span>
                </div>

                ${issueHTML}

                <button class="copy-btn" onclick="copyLink(this, '${link}')">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copy Order Link
                </button>
            `;
            
            grid.appendChild(card);
        }
    }

    function copyLink(btnElement, linkUrl) {
        navigator.clipboard.writeText(linkUrl).then(() => {
            const originalText = btnElement.innerHTML;
            btnElement.classList.add('copied');
            btnElement.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Link Copied!`;
            
            setTimeout(() => {
                btnElement.classList.remove('copied');
                btnElement.innerHTML = originalText;
            }, 2000);
        }).catch(err => {
            alert("Copy failed.");
        });
    }

    fetchData();
    setInterval(fetchData, REFRESH_INTERVAL * 1000);
  </script>
</body>
</html>
